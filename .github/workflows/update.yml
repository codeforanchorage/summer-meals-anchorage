name: Build summer meals page

on:
  schedule:
    # 13:00 UTC ≈ 5:00 AM Alaska time — rebuild each morning so the
    # "Open today" section reflects the current day in Anchorage.
    - cron: "0 13 * * *"
  workflow_dispatch: {}   # lets you trigger a manual rebuild any time

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate page
        run: python3 generate.py
        env:
          # Optional: set a repo variable named SERVICE_URL to point at the
          # current season's endpoint without editing code. Leave it unset
          # to use the default baked into generate.py.
          SERVICE_URL: ${{ vars.SERVICE_URL }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
